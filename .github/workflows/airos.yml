# Builds the air/OS packages (x86_64 and arm64) on every push to main and publishes them to the
# rolling "latest" release, with links in the README; the image builds take them from the package
# pool. arm64 runs with airos-ci's nodejs22 (deps/recipes/nodejs22.sh), x86_64 with HaikuPorts'.
# The pipeline itself lives in jmgasper/airos-ci (apps/build-app-packages.sh, build_aurora).
name: air/OS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  airos:
    uses: jmgasper/airos-ci/.github/workflows/app.yml@main
    with:
      app: aurora
      repo-dir: aurora
    permissions:
      contents: write
